<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 612" width="960" height="612" role="img" aria-label="Replay of an antstreet audit run with a fake model: audit plan seals 2 of 4 checks, the agent's own tests pass, audit check says REFUTED with c01 and c02 failed, and audit report adds the floor sentence"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;white-space:pre;fill:#c9d1d9}.m{fill:#8b949e}.c{fill:#e6edf3}.d{fill:#ffc61a}.v{fill:#ff7b72;font-weight:700}.p{fill:#3fb950}.n{fill:#8b949e;font-style:italic}.lab{font-size:13px;fill:#8b949e}#k0{animation:w0 1.6s steps(51,end) 0.40s both}@keyframes w0{from{width:0}to{width:463.0px}}.l1{animation:a 0.01s steps(1,end) 2.50s both}.l2{animation:a 0.01s steps(1,end) 2.92s both}.l3{animation:a 0.01s steps(1,end) 3.34s both}.l4{animation:a 0.01s steps(1,end) 3.76s both}.l5{animation:a 0.01s steps(1,end) 4.18s both}.l6{animation:a 0.01s steps(1,end) 4.60s both}.l7{animation:a 0.01s steps(1,end) 5.02s both}.l8{animation:a 0.01s steps(1,end) 5.44s both}.l9{animation:a 0.01s steps(1,end) 5.86s both}.l10{animation:a 0.01s steps(1,end) 6.28s both}.l11{animation:a 0.01s steps(1,end) 6.70s both}.l13{animation:a 0.01s steps(1,end) 7.62s both}#k14{animation:w14 0.95s steps(27,end) 8.04s both}@keyframes w14{from{width:0}to{width:247.0px}}.l15{animation:a 0.01s steps(1,end) 9.49s both}#k17{animation:w17 1.51s steps(43,end) 10.41s both}@keyframes w17{from{width:0}to{width:391.0px}}.l18{animation:a 0.01s steps(1,end) 12.42s both}.l19{animation:a 0.01s steps(1,end) 12.84s both}.l20{animation:a 0.01s steps(1,end) 13.44s both}.l21{animation:a 0.01s steps(1,end) 13.86s both}.l22{animation:a 0.01s steps(1,end) 14.46s both}#k24{animation:w24 1.09s steps(31,end) 15.56s both}@keyframes w24{from{width:0}to{width:283.0px}}.l25{animation:a 0.01s steps(1,end) 17.15s both}.l26{animation:a 0.01s steps(1,end) 17.57s both}@keyframes a{from{opacity:0}to{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="960" height="612" rx="12" fill="#0d1117"/><rect width="960" height="34" rx="12" fill="#161b22"/><rect y="22" width="960" height="12" fill="#161b22"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/><text x="480.0" y="22" text-anchor="middle" class="lab">replay of a test-suite run (fake model), not a live recording · output trimmed</text><clipPath id="q0"><rect id="k0" x="20" y="47" height="20" width="463.0"/></clipPath><text x="24" y="62" class="c" clip-path="url(#q0)"><tspan class="d">$</tspan> uv run antstreet audit plan --request request.txt</text><text x="24" y="82" class="m l1">Running the checks on the base...</text><text x="24" y="102" class="m l2">Check c01 [t1] runs of symbols become one hyphen</text><text x="24" y="122" class="m l3">Check c02 [t1] hyphens are trimmed at both ends</text><text x="24" y="142" class="m l4">Check c03 [t1] a plain word is unchanged</text><text x="24" y="162" class="m l5">Check c04 [t1] needs a library</text><text x="24" y="182" class="m l6">  c01: fails on the base: counted</text><text x="24" y="202" class="m l7">  c02: fails on the base: counted</text><text x="24" y="222" class="m l8">  c03: passes on the base: shown, not counted</text><text x="24" y="242" class="m l9">  c04: cannot run here: not counted (needs module 'nosuchlib_zq')</text><text x="24" y="262" class="c l10">2 of 4 checks will be counted.</text><text x="24" y="282" class="c l11">Sealed audit run 20261008T220910Z-cf301f: 2 of 4 checks fail on the base and will be counted.</text><text x="24" y="322" class="n l13"># the agent works on its own branch, then runs its own tests:</text><clipPath id="q14"><rect id="k14" x="20" y="327" height="20" width="247.0"/></clipPath><text x="24" y="342" class="c" clip-path="url(#q14)"><tspan class="d">$</tspan> python -m pytest -q tests</text><text x="24" y="362" class="p l15">2 passed in 0.00s</text><clipPath id="q17"><rect id="k17" x="20" y="387" height="20" width="391.0"/></clipPath><text x="24" y="402" class="c" clip-path="url(#q17)"><tspan class="d">$</tspan> uv run antstreet audit check --claim done</text><text x="24" y="422" class="m l18">Run 20261008T220910Z-cf301f: head b9cde65e3eef on base 450109a66507</text><text x="24" y="442" class="v l19">Verdict: REFUTED (claim: done, pre-registered)</text><text x="24" y="462" class="m l20">Counted checks (failing on the base): 2; failing on the head: 2</text><text x="24" y="482" class="v l21">  c01 failed: runs of symbols become one hyphen</text><text x="24" y="502" class="v l22">  c02 failed: hyphens are trimmed at both ends</text><clipPath id="q24"><rect id="k24" x="20" y="527" height="20" width="283.0"/></clipPath><text x="24" y="542" class="c" clip-path="url(#q24)"><tspan class="d">$</tspan> uv run antstreet audit report</text><text x="24" y="562" class="m l25">  b9cde65e3eef [(no label)] pre-registered: refuted, failed c01, c02 of 2 counted</text><text x="24" y="582" class="c l26">A floor, not a measurement of the agent: an unrefuted claim is not a correct one.</text></svg>
