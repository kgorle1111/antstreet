<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -350 360 360" width="360" height="360" role="img" aria-label="A worker ant: yellow hard hat, three body segments, carrying a code block"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-weight:700}
.o{stroke:#0f1b2d;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.l{fill:none;stroke:#0f1b2d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@keyframes bob{50%{transform:translateY(-6px)}}
.bob{animation:bob 1.6s ease-in-out infinite}.b2{animation-delay:-.5s}.b3{animation-delay:-1s}
@keyframes glint{0%,70%,100%{opacity:0}78%,88%{opacity:1}}
.glint{animation:glint 4s ease-in-out infinite}
@keyframes drain{0%{width:300px}85%,100%{width:96px}}
@keyframes stamp{0%,80%{opacity:0;transform:scale(2.2) rotate(-14deg)}90%,100%{opacity:1;transform:scale(1) rotate(-14deg)}}
.bar{animation:drain 8s ease-in-out infinite alternate}
.seal{transform-box:fill-box;transform-origin:center;animation:stamp 8s ease-out infinite}
@keyframes t0{0%,10%{opacity:0}16%,100%{opacity:1}}.t0{animation:t0 8s infinite}
@keyframes t1{0%,28%{opacity:0}34%,100%{opacity:1}}.t1{animation:t1 8s infinite}
