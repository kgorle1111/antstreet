@keyframes k0{0%,11.53%{opacity:0}11.54%,94%{opacity:1}100%{opacity:0}}.l0{animation:k0 26.0s infinite both}@keyframes k1{0%,14.61%{opacity:0}14.62%,94%{opacity:1}100%{opacity:0}}.l1{animation:k1 26.0s infinite both}@keyframes k2{0%,14.61%{opacity:0}14.62%,94%{opacity:1}100%{opacity:0}}.l2{animation:k2 26.0s infinite both}@keyframes k3{0%,14.61%{opacity:0}14.62%,94%{opacity:1}100%{opacity:0}}.l3{animation:k3 26.0s infinite both}@keyframes k4{0%,14.61%{opacity:0}14.62%,94%{opacity:1}100%{opacity:0}}.l4{animation:k4 26.0s infinite both}@keyframes k5{0%,17.68%{opacity:0}17.69%,94%{opacity:1}100%{opacity:0}}.l5{animation:k5 26.0s infinite both}@keyframes k6{0%,19.99%{opacity:0}20.00%,94%{opacity:1}100%{opacity:0}}.l6{animation:k6 26.0s infinite both}@keyframes k7{0%,19.99%{opacity:0}20.00%,94%{opacity:1}100%{opacity:0}}.l7{animation:k7 26.0s infinite both}@keyframes k8{0%,28.45%{opacity:0}28.46%,94%{opacity:1}100%{opacity:0}}.l8{animation:k8 26.0s infinite both}@keyframes k9{0%,34.61%{opacity:0}34.62%,94%{opacity:1}100%{opacity:0}}.l9{animation:k9 26.0s infinite both}@keyframes k10{0%,42.30%{opacity:0}42.31%,94%{opacity:1}100%{opacity:0}}.l10{animation:k10 26.0s infinite both}@keyframes k11{0%,51.91%{opacity:0}51.92%,94%{opacity:1}100%{opacity:0}}.l11{animation:k11 26.0s infinite both}@keyframes k12{0%,54.61%{opacity:0}54.62%,94%{opacity:1}100%{opacity:0}}.l12{animation:k12 26.0s infinite both}@keyframes k13{0%,57.30%{opacity:0}57.31%,94%{opacity:1}100%{opacity:0}}.l13{animation:k13 26.0s infinite both}@keyframes k14{0%,60.76%{opacity:0}60.77%,94%{opacity:1}100%{opacity:0}}.l14{animation:k14 26.0s infinite both}@media (prefers-reduced-motion:reduce){*{animation:none!important}#tw{width:361px}}</style><rect width="900" height="560" rx="10" fill="#0d1117"/><rect width="900" height="34" rx="10" fill="#161b22"/><rect y="24" width="900" height="10" fill="#161b22"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="42" cy="17" r="6" fill="#ffbd2e"/><circle cx="64" cy="17" r="6" fill="#27c93f"/><text x="450" y="22" text-anchor="middle" fill="#8b949e" font-size="12" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">replay of a test-suite run (fake model), not a live recording</text><text x="20" y="66" fill="#3fb950">$</text><clipPath id="c"><rect id="tw" x="40" y="50" width="0" height="22"/></clipPath><text x="40" y="66" fill="#e6edf3" clip-path="url(#c)" textLength="361" lengthAdjust="spacing">boss fund "Reverse a string." --budget 0.50</text><text class="l0" x="20" y="96" fill="#8b949e">drafting the term sheet...</text><text class="l1" x="20" y="122" fill="#e6edf3">TERM SHEET</text><text class="l2" x="20" y="142" fill="#e6edf3">Idea: Reverse a string.</text><text class="l3" x="20" y="162" fill="#e6edf3">Budget: $0.5 (estimated cost, not a bill)</text><text class="l4" x="20" y="182" fill="#e6edf3">Round 1: $0.5, next unlocks at 1 passing checks</text><text class="l5" x="20" y="208" fill="#79c0ff">Task t1 (owns rev.py):</text><text class="l6" x="20" y="228" fill="#79c0ff">Check c01 [t1] reverses a word</text><text class="l7" x="20" y="248" fill="#a5d6ff">    assert reverse('ab') == 'ba'</text><text class="l8" x="20" y="274" fill="#ffa657">[a]pprove, [r]eject, or [e]dit files and re-check? a</text><text class="l9" x="20" y="294" fill="#e6edf3">Approved. Hiring a worker...</text><text class="l10" x="20" y="314" fill="#e6edf3">w1 slice 1 on t1: 1/1 checks pass; round 1 has spent $0.006 of $0.5</text><text class="l11" x="20" y="340" fill="#e6edf3">BOARD REPORT</text><text class="l12" x="20" y="366" fill="#3fb950">Round 1: 1/1 checks passed, next round unlocked</text><text class="l13" x="20" y="386" fill="#3fb950">Checks ran sandboxed: 2 of 2.</text><text class="l14" x="20" y="406" fill="#3fb950">Delivered: yes (1 of 1 checks pass on the product)</text><g class="l14"><text x="20" y="440" fill="#8b949e" font-size="12">spend (CLI estimate, not a bill): boss $0.0040, worker:w1 $0.0060, total $0.0100</text></g></svg>