<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="AntStreet. It wrote its own checks. A green CHECKS PASSED seal; a sealed envelope of hidden checks opens, the card inside turns into a red diamond with an X reading HIDDEN CHECK: FAILED, and the seal cracks. Checks your AI coding agent's work against tests it never saw.">
<style>
/* Tokens: a self-backgrounded navy card by default; paper when the viewer prefers light. */
.bg{fill:#0f1b2d}.ink{fill:#f4f1ea}.emph{fill:#ffc61a}.mute{fill:#9aa7b8}.stage{fill:#13223a}.obar{fill:none}
@media (prefers-color-scheme:light){.bg{fill:#f4f1ea}.ink{fill:#0f1b2d}.emph{fill:#0f1b2d}.mute{fill:#4c5a6e}.stage{fill:#e4ded0}.bar,.obar{fill:#ffc61a}}
text{font-family:"Bricolage Grotesque",-apple-system,"SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif;font-weight:800}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;letter-spacing:.06em}
.caps{letter-spacing:.06em}
.a{animation-duration:8.9s;animation-iteration-count:infinite;animation-fill-mode:both}
.fb{transform-box:fill-box;transform-origin:50% 50%}
.ft{transform-box:fill-box;transform-origin:50% 0}
.fbot{transform-box:fill-box;transform-origin:50% 100%}
/* 0.0 s seal landed; 0.8 s match cut; 1.6 s flap opens; 1.9 s diamond, pill, crack; 2.6 s lockup; hold; 0.3 s crossfade */
#front{animation-name:front;animation-timing-function:steps(1,end)}
@keyframes front{0%,8.98%{opacity:1}9%,96.6%{opacity:0}100%{opacity:1}}
#world{animation-name:world}
@keyframes world{0%,8.98%{opacity:0}9%,96.6%{opacity:1}100%{opacity:0}}
#flapf{animation-name:flapf;animation-timing-function:cubic-bezier(.65,0,.35,1)}
@keyframes flapf{0%,18%{transform:scaleY(1)}19.5%,100%{transform:scaleY(0)}}
#flapb{animation-name:flapb;animation-timing-function:cubic-bezier(.65,0,.35,1)}
@keyframes flapb{0%,19.5%{transform:scaleY(0)}21%,100%{transform:scaleY(1)}}
#wax{animation-name:wax}
@keyframes wax{0%,18%{opacity:1}20%,100%{opacity:0}}
#waxl{animation-name:waxl}#waxr{animation-name:waxr}
@keyframes waxl{0%,18%{transform:translate(0,0) rotate(0)}19%,100%{transform:translate(-10px,0) rotate(-10deg)}}
@keyframes waxr{0%,18%{transform:translate(0,0) rotate(0)}19%,100%{transform:translate(10px,0) rotate(10deg)}}
#card{animation-name:card;animation-timing-function:cubic-bezier(.16,1,.3,1)}
@keyframes card{0%,18.5%{transform:translateY(230px)}21.1%,100%{transform:translateY(0)}}
#circ{animation-name:circ;animation-timing-function:cubic-bezier(.7,0,.2,1)}
@keyframes circ{0%,21.35%{opacity:1;transform:scale(1)}23.3%,100%{opacity:0;transform:scale(.8)}}
#dia{animation-name:dia;animation-timing-function:cubic-bezier(.7,0,.2,1)}
@keyframes dia{0%,21.35%{opacity:0;transform:rotate(0) scale(.8)}23.3%,100%{opacity:1;transform:rotate(45deg) scale(1)}}
.x{stroke-dasharray:1;animation-name:x;animation-timing-function:linear}
@keyframes x{0%,22.4%{stroke-dashoffset:1}23.6%,100%{stroke-dashoffset:0}}
#pill{animation-name:pill}
@keyframes pill{0%,21.35%{opacity:0}22%,100%{opacity:1}}
#crack{stroke-dasharray:1;animation-name:crack;animation-timing-function:linear}
@keyframes crack{0%,21.35%{stroke-dashoffset:1}22.8%,100%{stroke-dashoffset:0}}
#hl{animation-name:hl;animation-timing-function:cubic-bezier(.7,0,.2,1)}#hr{animation-name:hr;animation-timing-function:cubic-bezier(.7,0,.2,1)}
@keyframes hl{0%,21.35%{transform:translate(0,0) rotate(0)}22.8%,100%{transform:translate(-12px,4px) rotate(-6deg)}}
@keyframes hr{0%,21.35%{transform:translate(0,0) rotate(0)}22.8%,100%{transform:translate(12px,-4px) rotate(6deg)}}
#lock{animation-name:lock;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
@keyframes lock{0%,29.2%{opacity:0;transform:translateY(16px)}31.1%,96.6%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<g id="seal">
<circle r="110" fill="#2fb457" stroke="#0f1b2d" stroke-width="7"/>
<polyline points="-48,-8 -12,30 50,-40" fill="none" stroke="#f4f1ea" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="rotate(-6) translate(0 80)"><rect x="-146" y="-27" width="292" height="54" rx="27" fill="#2fb457" stroke="#0f1b2d" stroke-width="6"/><text y="10" text-anchor="middle" font-size="29" fill="#0f1b2d" class="caps">CHECKS PASSED</text></g>
</g>
<clipPath id="cl"><polygon points="-260,-260 8,-260 8,-124 -10,-40 14,38 -2,124 -2,260 -260,260"/></clipPath>
<clipPath id="cr"><polygon points="260,-260 8,-260 8,-124 -10,-40 14,38 -2,124 -2,260 260,260"/></clipPath>
<g id="waxart"><circle r="72" fill="#e3a82e" stroke="#0f1b2d" stroke-width="6"/><circle r="54" fill="none" stroke="#b9861d" stroke-width="4"/><path d="M0 -24 a12 12 0 1 1 -0.1 0 Z M-7 -8 L7 -8 L10 26 L-10 26 Z" fill="#0f1b2d"/></g>
<clipPath id="wl"><polygon points="-90,-90 4,-90 -6,-24 8,24 -2,90 -90,90"/></clipPath>
<clipPath id="wr"><polygon points="90,-90 4,-90 -6,-24 8,24 -2,90 90,90"/></clipPath>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/><feComponentTransfer><feFuncR type="linear" slope=".6"/><feFuncG type="linear" slope=".6"/><feFuncB type="linear" slope=".6"/></feComponentTransfer></filter>
</defs>
<rect class="bg" width="1200" height="560" rx="24"/>
<rect class="stage" x="600" y="24" width="576" height="512" rx="20"/>

<text x="64" y="92" font-size="34" class="ink">AntStreet</text>
<rect class="emph bar" x="120" y="100" width="94" height="6" rx="3"/>
<text x="64" y="214" font-size="76" class="ink">It wrote its</text>
<rect class="obar" x="64" y="290" width="146" height="14" rx="3"/>
<text x="64" y="300" font-size="76" class="ink"><tspan class="emph">own</tspan> checks.</text>
<g id="lock" class="a">
<text x="64" y="398" font-size="30" class="ink"><tspan x="64">Checks your AI coding agent's work</tspan><tspan x="64" dy="40">against tests it never saw.</tspan></text>
</g>

<g transform="translate(888 300)">
<g id="world" class="a">
<g transform="translate(-222 -168) scale(.62)" filter="url(#soft)">
<g id="hl" class="a fb" transform="translate(-12 4) rotate(-6)"><use href="#seal" clip-path="url(#cl)"/></g>
<g id="hr" class="a fb" transform="translate(12 -4) rotate(6)"><use href="#seal" clip-path="url(#cr)"/></g>
<polyline id="crack" class="a" points="8,-124 -10,-40 14,38 -2,124" pathLength="1" fill="none" stroke="#0f1b2d" stroke-width="11" stroke-linejoin="round"/>
</g>
<g id="flapb" class="a fbot"><polygon points="-220,-100 220,-100 0,-240" fill="#ebe0c6" stroke="#0f1b2d" stroke-width="7" stroke-linejoin="round"/></g>
<rect x="-220" y="-100" width="440" height="280" rx="16" fill="#e3d7bb" stroke="#0f1b2d" stroke-width="7"/>
<g id="card" class="a">
<g transform="translate(0 -170)">
<rect x="-166" y="-95" width="332" height="190" rx="16" fill="#f4f1ea" stroke="#0f1b2d" stroke-width="6"/>
<g transform="translate(0 -28)">
<g id="circ" class="a fb" opacity="0"><circle r="36" fill="#e3a82e" stroke="#0f1b2d" stroke-width="6"/></g>
<g id="dia" class="a fb" transform="rotate(45)"><rect x="-34" y="-34" width="68" height="68" rx="6" fill="#ff5a4f" stroke="#0f1b2d" stroke-width="6"/></g>
<g stroke="#0f1b2d" stroke-width="8" stroke-linecap="round"><line class="a x" x1="-13" y1="-13" x2="13" y2="13" pathLength="1"/><line class="a x" x1="13" y1="-13" x2="-13" y2="13" pathLength="1"/></g>
</g>
<g id="pill" class="a" transform="translate(0 52)"><rect x="-152" y="-22" width="304" height="44" rx="22" fill="#ff5a4f" stroke="#0f1b2d" stroke-width="5"/><text y="8" text-anchor="middle" font-size="21" fill="#0f1b2d" class="caps">HIDDEN CHECK: FAILED</text></g>
</g>
</g>
<path d="M-220 -100 L0 40 L220 -100 L220 164 Q220 180 204 180 L-204 180 Q-220 180 -220 164 Z" fill="#f4f1ea" stroke="#0f1b2d" stroke-width="7" stroke-linejoin="round"/>
<rect x="-124" y="100" width="248" height="46" rx="7" fill="#0f1b2d"/>
<text y="131" text-anchor="middle" font-size="24" fill="#f4f1ea" class="mono">HIDDEN CHECKS</text>
<g id="flapf" class="a ft" transform="scale(1 0)"><polygon points="-220,-100 220,-100 0,40" fill="#ebe0c6" stroke="#0f1b2d" stroke-width="7" stroke-linejoin="round"/></g>
<g transform="translate(0 12)"><g id="wax" class="a" opacity="0">
<g id="waxl" class="a fb"><use href="#waxart" clip-path="url(#wl)"/></g>
<g id="waxr" class="a fb"><use href="#waxart" clip-path="url(#wr)"/></g>
</g></g>
</g>
<g id="front" class="a" opacity="0"><use href="#seal"/></g>
</g>
</svg>
