<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="boss: coding agents say done, make it verifiable"><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes tick{0%,var(--s){opacity:0}100%{opacity:1}}
@keyframes drain{0%{width:300px}85%,100%{width:96px}}
@keyframes stamp{0%,80%{opacity:0;transform:scale(2.2) rotate(-14deg)}90%{opacity:1;transform:scale(1) rotate(-14deg)}100%{opacity:1;transform:scale(1) rotate(-14deg)}}
@keyframes pulse{50%{opacity:.45}}
.bar{animation:drain 8s ease-in-out infinite alternate}
.seal{transform-box:fill-box;transform-origin:center;animation:stamp 8s ease-out infinite}
.ph{animation:pulse 3s ease-in-out infinite}
@keyframes t0{0%,10%{opacity:0}16%,100%{opacity:1}}.t0{animation:t0 8s infinite}@keyframes t1{0%,28%{opacity:0}34%,100%{opacity:1}}.t1{animation:t1 8s infinite}@keyframes t2{0%,46%{opacity:0}52%,100%{opacity:1}}.t2{animation:t2 8s infinite}@keyframes t3{0%,64%{opacity:0}70%,100%{opacity:1}}.t3{animation:t3 8s infinite}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1b2a3a"/></linearGradient></defs><rect width="1200" height="420" rx="16" fill="url(#g)"/><text x="60" y="170" font-size="120" font-weight="800" fill="#f0f6fc" letter-spacing="-4">boss</text><text x="64" y="225" font-size="30" font-weight="600" fill="#e6edf3">Coding agents say "done". Make it verifiable.</text><text x="64" y="268" font-size="19" fill="#8b949e">Checks you approve first. A gate, not the agent, decides what passed.</text><text x="64" y="296" font-size="19" fill="#8b949e">Every dollar and decision on a signed ledger.</text><text class="m" x="64" y="345" font-size="14" fill="#8b949e">budget</text><rect x="130" y="332" width="300" height="14" rx="7" fill="#21262d"/><rect class="bar" x="130" y="332" width="300" height="14" rx="7" fill="#f0883e"/><g class="t0"><rect x="700" y="74" width="330" height="42" rx="8" fill="#161b22" stroke="#30363d"/><circle cx="728" cy="95" r="12" fill="#238636"/><path d="M721 95 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="752" y="100" font-size="18" fill="#e6edf3">checks you approved</text></g><g class="t1"><rect x="700" y="126" width="330" height="42" rx="8" fill="#161b22" stroke="#30363d"/><circle cx="728" cy="147" r="12" fill="#238636"/><path d="M721 147 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="752" y="152" font-size="18" fill="#e6edf3">agents inside a budget</text></g><g class="t2"><rect x="700" y="178" width="330" height="42" rx="8" fill="#161b22" stroke="#30363d"/><circle cx="728" cy="199" r="12" fill="#238636"/><path d="M721 199 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="752" y="204" font-size="18" fill="#e6edf3">gate in a sandbox</text></g><g class="t3"><rect x="700" y="230" width="330" height="42" rx="8" fill="#161b22" stroke="#30363d"/><circle cx="728" cy="251" r="12" fill="#238636"/><path d="M721 251 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="752" y="256" font-size="18" fill="#e6edf3">ledger, signed</text></g><g class="seal"><circle cx="1000" cy="340" r="52" fill="none" stroke="#3fb950" stroke-width="5"/><circle cx="1000" cy="340" r="44" fill="none" stroke="#3fb950" stroke-width="2"/><text x="1000" y="334" text-anchor="middle" font-size="16" font-weight="800" fill="#3fb950">VERIFIED</text><text x="1000" y="356" text-anchor="middle" font-size="12" fill="#3fb950">by the gate</text></g><g class="ph"><circle cx="1130" cy="110" r="46" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 6"/><text x="1130" y="106" text-anchor="middle" font-size="12" fill="#8b949e">MASCOT</text><text x="1130" y="122" text-anchor="middle" font-size="12" fill="#8b949e">goes here</text></g></svg>