<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -350 360 360" width="360" height="360" role="img" aria-label="The bull boss: business suit, nose ring, clipboard of ticked checks"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-weight:700}
