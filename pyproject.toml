[project]
# kn: placeholder distribution name; "boss" is taken on PyPI. Final name is decided before the first release.
name = "boss"
version = "0.0.1"
description = "Fund an idea; an LLM boss runs the firm that builds it, releasing budget in rounds against passing checks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# The gate runs term-sheet checks with pytest, so it is needed at runtime, not only in development.
dependencies = ["pytest>=8"]

[project.scripts]
boss = "boss.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".claude", ".boss", "bench/tasks/*/mutants"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# Tests are not checked yet; widen `files` when they are.
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/boss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A plain `uv run pytest` is the quick run: one worker per core, and not the `slow` tests (CI runs
# them) nor the `sigint` ones (serial only). A -m on the command line replaces the -m here.
addopts = "-q -n auto --dist loadgroup -m 'not slow and not sigint'"
markers = [
    "slow: spawns many subprocesses (sandboxed gates, benchmark task validation, simulated firms). Left out of a plain `uv run pytest`; CI runs them.",
    "sigint: a fake worker sends a real SIGINT to the pytest process (Ctrl-C mid-run). Under load plus coverage that has hung a parallel worker, so CI runs these after the parallel run, serially.",
]

[tool.coverage.run]
source = ["src/boss"]
branch = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":', "raise NotImplementedError"]
