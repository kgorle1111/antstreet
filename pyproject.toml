[project]
# kn: placeholder distribution name; "boss" is taken on PyPI. Final name is decided before the first release.
name = "boss"
version = "0.0.1"
description = "Fund an idea; an LLM boss runs the firm that builds it, releasing budget in rounds against passing checks."
readme = "README.md"
requires-python = ">=3.12"
# The gate runs term-sheet checks with pytest, so it is needed at runtime, not only in development.
dependencies = ["pytest>=8"]

[project.scripts]
boss = "boss.cli:main"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".claude", ".boss", "bench/tasks/*/mutants"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/boss"]
branch = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":', "raise NotImplementedError"]
