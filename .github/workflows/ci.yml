name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"  # nightly: every benchmark task is validated for real, no cache

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test (${{ matrix.os }}${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    # The suite runs thousands of real pytest and worker subprocesses, and on Linux every gate runs
    # inside bwrap on a 4-core runner: one job over the whole suite hit the 30 minute limit. So
    # Linux is split into three shards by test file (BOSS_SHARD, tests/conftest.py; a file's
    # fixtures and xdist groups stay on one shard) and each job must end in 20 minutes. macOS runs
    # the whole suite in one job, off pull requests. --durations below names the slow tests so the next slowdown can
    # be read, not guessed. That one macOS job (3-core runner) reached 57% of the suite in 20 minutes,
    # so it gets 45; BOSS_TEST_TIMEOUT_S still ends a single hung test after 15.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 45 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs only on a push to main and the nightly run, never on a pull_request (owner
        # decision 2026-10-05: its minutes cost the most). `matrix` is not visible to a job-level
        # `if`, so the list itself is chosen here; the Linux shards are the same in both.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","shard":"0/3"},{"os":"ubuntu-latest","shard":"1/3"},{"os":"ubuntu-latest","shard":"2/3"}]' || '[{"os":"ubuntu-latest","shard":"0/3"},{"os":"ubuntu-latest","shard":"1/3"},{"os":"ubuntu-latest","shard":"2/3"},{"os":"macos-latest","shard":""}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request run diffs against origin/<base> (BOSS_VALIDATE_TASKS_SINCE below), which
          # needs the history back to the merge base.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The gate sandboxes every check with bwrap on Linux (docs/SANDBOX.md); the runner image
      # does not ship it.
      #
      # Ubuntu 24.04 sets kernel.apparmor_restrict_unprivileged_userns=1: an unprivileged process
      # may create a user namespace but gets no capabilities in it unless an AppArmor profile
      # allows `userns` for that program, and bwrap then dies with "setting up uid map:
      # Permission denied". The least-privilege fix is a profile for /usr/bin/bwrap alone, the
      # one Ubuntu documents for such tools. It leaves the restriction on for everything else on
      # the runner. The alternative, `sysctl -w kernel.apparmor_restrict_unprivileged_userns=0`,
      # lifts it for every process on the machine. Only applied when the restriction is on, so an
      # image without it (Ubuntu 22.04) is left alone. The last line prints bwrap's own error: the
      # tests only see "sandbox unavailable".
      - name: Install bubblewrap and allow it to create user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --version
          bwrap --unshare-net --unshare-pid --ro-bind / / --dev /dev --proc /proc true

      # A benchmark task that passed under the same files, validator and gate code is not run
      # through the gate again (tests/changed_tasks.py, BOSS_TASK_CACHE). The key changes with any
      # of those, restore-keys brings back the older entries, and only a pass is ever stored. The
      # nightly run skips the cache so every task is validated for real at least once a day.
      - name: Restore passed task validations
        if: github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: .task-cache
          key: task-validation-${{ runner.os }}-${{ hashFiles('bench/tasks/**', 'bench/tasks-multi/**', 'src/antstreet/bench/tasks.py', 'src/antstreet/gate.py', 'src/antstreet/sandbox.py', 'src/antstreet/_gate_plugin.py', 'uv.lock', 'pyproject.toml') }}
          restore-keys: task-validation-${{ runner.os }}-

      # --locked fails if uv.lock is out of date, so CI installs exactly what was tested locally.
      - name: Install from a clean clone
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # No model calls and no secrets: the live test is skipped unless BOSS_LIVE=1.
      # The coverage floor (line + branch over src/antstreet) is 2 points below the 98.58% measured
      # when the gate was added, rounded down: 96. That leaves room for normal work and still
      # catches a real drop. Only ever raise it: when total coverage settles 2+ points above it,
      # move it up to (total - 2).
      #
      # On Linux the sandbox must run, not be skipped: `require` makes the gate and the sandbox
      # tests fail loudly (SandboxUnavailable, with the fix) when bwrap cannot start. macOS keeps
      # `auto`, which is the default and sandboxes there with sandbox-exec.
      #
      # -n auto runs the tests on one worker per core (pytest-xdist); pytest-cov merges the
      # workers' coverage. --dist loadgroup keeps tests marked xdist_group (the ledger document's
      # expensive shared fixture) on one worker.
      #
      # The tests marked sigint make a fake worker send a real SIGINT to the pytest process. On a
      # busy machine with coverage on, that hung a parallel worker, so they run afterwards in a
      # second, serial invocation (-n 0) that appends to the first one's coverage data.
      #
      # A pull request fully validates only the benchmark tasks it changes (the task set hash and
      # count are still checked for all of them); a push to main and the nightly run validate
      # every task. BOSS_SHARD keeps this job's share of the test files; empty means all of them.
      # BOSS_TEST_TIMEOUT_S ends the process when one test hangs, with its stacks, so a hang costs
      # 15 minutes of one job instead of the whole job timeout.
      - name: Test
        env:
          BOSS_GATE_SANDBOX: ${{ runner.os == 'Linux' && 'require' || 'auto' }}
          BOSS_VALIDATE_TASKS_SINCE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          BOSS_SHARD: ${{ matrix.shard }}
          BOSS_TASK_CACHE: ${{ github.event_name != 'schedule' && format('{0}/.task-cache', github.workspace) || '' }}
          BOSS_TEST_TIMEOUT_S: "900"
        run: uv run pytest -n auto --dist loadgroup -m "not sigint" --cov --cov-report= --durations=30

      - name: Test (Ctrl-C tests, serial)
        env:
          BOSS_GATE_SANDBOX: ${{ runner.os == 'Linux' && 'require' || 'auto' }}
          BOSS_SHARD: ${{ matrix.shard }}
          BOSS_TEST_TIMEOUT_S: "900"
        # Exit code 5 is "no tests collected": a shard whose files hold no sigint test is fine.
        run: uv run pytest -n 0 -m sigint --cov --cov-append --cov-report= || [ $? -eq 5 ]

      # macOS runs the whole suite in this one job, so the floor is enforced here. A Linux shard
      # holds only part of the suite: it hands its coverage data to the `coverage` job below.
      - name: Coverage floor (whole suite)
        if: matrix.shard == ''
        run: uv run coverage report --show-missing --fail-under=96

      - name: Keep this shard's coverage data
        if: matrix.shard != ''
        run: cp .coverage cov-shard-${{ strategy.job-index }}

      - name: Upload this shard's coverage data
        if: matrix.shard != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux-${{ strategy.job-index }}
          path: cov-shard-${{ strategy.job-index }}

  # The floor over the whole Linux suite: the three shards' data, combined.
  coverage:
    name: combined coverage (ubuntu-latest)
    needs: test
    # The floor is over the Linux shards only, so a slow or failed macOS job must not skip it; a
    # missing shard's data still fails the combine step below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install from a clean clone
        run: uv sync --locked
      - name: Download the shards' coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-linux-*
          path: cov
          merge-multiple: true
      - name: Combine
        run: uv run coverage combine cov/cov-shard-*
      - name: Report
        run: uv run coverage report --show-missing --fail-under=96
