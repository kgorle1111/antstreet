name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite runs hundreds of real pytest and worker subprocesses; the runners took over 10
    # minutes once parallel waves and the known-wrong implementations landed. --durations below
    # names the slow tests in the log so the next slowdown can be read, not guessed.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date, so CI installs exactly what was tested locally.
      - name: Install from a clean clone
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # No model calls and no secrets: the live test is skipped unless BOSS_LIVE=1.
      # The coverage floor (line + branch over src/boss) is 2 points below the 98.58% measured
      # when the gate was added, rounded down: 96. That leaves room for normal work and still
      # catches a real drop. Only ever raise it: when total coverage settles 2+ points above it,
      # move it up to (total - 2).
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=96 --durations=30
